
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Blackjack Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body style="background:#111;color:white;font-family:sans-serif;text-align:center;padding:40px;">

  <h1>🃏 Blackjack Mini App</h1>
  <p id="user"></p>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
      document.getElementById("user").innerText =
        "Привет, " + (user.first_name || user.username || "Игрок");
    } else {
      document.getElementById("user").innerText =
        "Открыто вне Telegram";
    }
  </script>

</body>
 
</html>

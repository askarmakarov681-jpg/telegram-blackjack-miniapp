<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
    }

    .card {
      background: #171717;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .balance {
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      font-size: 14px;
      color: #d7d7d7;
      margin-top: 8px;
    }

    .cards {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .playing-card {
      min-width: 56px;
      height: 78px;
      border-radius: 12px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .controls-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button, input {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
    }

    input {
      background: #222;
      color: #fff;
      outline: none;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary { background: #2ecc71; color: #111; }
    .btn-secondary { background: #3498db; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-dark { background: #2a2a2a; color: #fff; }

    .muted {
      color: #bdbdbd;
      font-size: 13px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .log-item {
      background: #202020;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
    }

    .admin-box {
      display: none;
    }

    .admin-box.show {
      display: block;
    }

    .small {
      font-size: 12px;
      color: #bfbfbf;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="topbar">
        <div>
          <h1>🃏 Blackjack</h1>
          <div id="playerName" class="muted">Игрок</div>
        </div>
        <div class="balance">💰 <span id="balance">0</span></div>
      </div>
      <div id="status" class="status">Загрузка...</div>
    </div>

    <div class="card">
      <h3>Ставка</h3>
      <div class="controls-3">
        <input id="betInput" type="number" min="1" step="1" value="50" />
        <button class="btn-dark" onclick="setBet(50)">50</button>
        <button class="btn-dark" onclick="setBet(100)">100</button>
      </div>
      <div style="height:10px"></div>
      <div class="controls-3">
        <button class="btn-dark" onclick="setBet(250)">250</button>
        <button class="btn-dark" onclick="setBet(500)">500</button>
        <button class="btn-primary" onclick="startGame()">Новая игра</button>
      </div>
    </div>

    <div class="card">
      <h3>Дилер: <span id="dealerScore">0</span></h3>
      <div id="dealerCards" class="cards"></div>
    </div>

    <div class="card">
      <h3>Ты: <span id="playerScore">0</span></h3>
      <div id="playerCards" class="cards"></div>
    </div>

    <div class="card">
      <div class="controls">
        <button id="hitBtn" class="btn-secondary" onclick="hit()">Взять</button>
        <button id="standBtn" class="btn-danger" onclick="stand()">Стоп</button>
      </div>
      <div style="height:10px"></div>
      <button id="rescueBtn" class="btn-primary" style="display:none;" onclick="rescueBonus()">
        Rescue bonus +1000
      </button>
    </div>

    <div class="card">
      <h3>История</h3>
      <div id="logs" class="log-list"></div>
    </div>

    <div id="adminBox" class="card admin-box">
      <h3>Админка</h3>
      <div class="controls">
        <input id="adminTargetId" type="text" placeholder="Telegram ID пользователя" />
        <button class="btn-dark" onclick="adminLoadUser()">Найти</button>
      </div>
      <div style="height:10px"></div>
      <div class="controls">
        <input id="adminAmount" type="number" placeholder="Сумма +/-" />
        <button class="btn-primary" onclick="adminChangeBalance()">Изменить баланс</button>
      </div>
      <div style="height:10px"></div>
      <pre id="adminResult" class="small" style="white-space:pre-wrap;"></pre>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const tgUser = tg?.initDataUnsafe?.user || null;

    const userId = tgUser?.id
      ? String(tgUser.id)
      : localStorage.getItem("debug_user_id") || prompt("Введи Telegram user id для теста");

    if (!tgUser?.id && userId) {
      localStorage.setItem("debug_user_id", userId);
    }

    const username = tgUser?.username || null;
    const firstName = tgUser?.first_name || "Игрок";

    document.getElementById("playerName").textContent =
      tgUser ? `${firstName}${username ? " (@" + username + ")" : ""}` : `Тестовый режим: ${userId}`;

    let currentState = null;

    async function api(url, method = "GET", body = null) {
      const options = {
        method,
        headers: { "Content-Type": "application/json" }
      };

      if (body) {
        options.body = JSON.stringify(body);
      }

      const res = await fetch(url, options);
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Ошибка запроса");
      }

      return data;
    }

    function setBet(value) {
      document.getElementById("betInput").value = value;
    }

    function renderCards(containerId, cards) {
      const el = document.getElementById(containerId);
      el.innerHTML = "";

      if (!cards || !cards.length) {
        el.innerHTML = `<div class="muted">Нет карт</div>`;
        return;
      }

      cards.forEach(card => {
        const div = document.createElement("div");
        div.className = "playing-card";
        div.textContent = card;
        el.appendChild(div);
      });
    }

    function renderLogs(logs) {
      const box = document.getElementById("logs");
      box.innerHTML = "";

      if (!logs || !logs.length) {
        box.innerHTML = `<div class="muted">История пока пустая</div>`;
        return;
      }

      logs.forEach(log => {
        const div = document.createElement("div");
        div.className = "log-item";
        div.innerHTML = `
          <div><b>${escapeHtml(log.action)}</b> — ${escapeHtml(log.status || "")}</div>
          <div class="small">Ставка: ${log.bet} | Баланс: ${log.balance}</div>
          <div class="small">Ты: ${(log.player_cards || []).join(" ")} (${log.player_score})</div>
          <div class="small">Дилер: ${(log.dealer_cards || []).join(" ")} (${log.dealer_score})</div>
          <div class="small">${escapeHtml(log.created_at || "")}</div>
        `;
        box.appendChild(div);
      });
    }

    function renderState(state) {
      currentState = state;

      document.getElementById("balance").textContent = state.balance;
      document.getElementById("status").textContent = state.status;
      document.getElementById("playerScore").textContent = state.playerScore;
      document.getElementById("dealerScore").textContent = state.dealerScore;
      document.getElementById("betInput").value = state.bet;

      renderCards("playerCards", state.player);
      renderCards("dealerCards", state.dealer);
      renderLogs(state.logs);

      document.getElementById("hitBtn").disabled = state.gameOver;
      document.getElementById("standBtn").disabled = state.gameOver;
      document.getElementById("rescueBtn").style.display = state.canRescueBonus ? "block" : "none";

      const adminIds = [123456789];
      if (adminIds.includes(Number(userId))) {
        document.getElementById("adminBox").classList.add("show");
      }
    }

    async function loadState() {
      try {
        const data = await api(`/api/game/state?userId=${encodeURIComponent(userId)}`);
        renderState(data);
      } catch (e) {
        alert(e.message);
      }
    }

    async function startGame() {
      try {
        const bet = Number(document.getElementById("betInput").value);

        const data = await api("/api/game/start", "POST", {
          userId,
          username,
          firstName,
          bet
        });

        renderState(data);
      } catch (e) {
        alert(e.message);
      }
    }

    async function hit() {
      try {
        const data = await api("/api/game/hit", "POST", { userId });
        renderState(data);
      } catch (e) {
        alert(e.message);
      }
    }

    async function stand() {
      try {
        const data = await api("/api/game/stand", "POST", { userId });
        renderState(data);
      } catch (e) {
        alert(e.message);
      }
    }

    async function rescueBonus() {
      try {
        const data = await api("/api/bonus/rescue", "POST", { userId });
        renderState(data);
      } catch (e) {
        alert(e.message);
      }
    }

    async function adminLoadUser() {
      try {
        const targetId = document.getElementById("adminTargetId").value.trim();
        const data = await api("/api/admin/user", "POST", {
          userId,
          targetId
        });

        document.getElementById("adminResult").textContent =
          JSON.stringify(data, null, 2);
      } catch (e) {
        alert(e.message);
      }
    }

    async function adminChangeBalance() {
      try {
        const targetId = document.getElementById("adminTargetId").value.trim();
        const amount = Number(document.getElementById("adminAmount").value);

        const data = await api("/api/admin/balance", "POST", {
          userId,
          targetId,
          amount
        });

        document.getElementById("adminResult").textContent =
          JSON.stringify(data, null, 2);
      } catch (e) {
        alert(e.message);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadState();
  </script>
</body>
</html>
